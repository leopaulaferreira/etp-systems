services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:${ETP_FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${ETP_BACKEND_PORT:-18080}:8080"
    environment:
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-etp_db}
      DB_USER: ${DB_USER:-etp_user}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET em backend/.env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173},http://localhost:${ETP_FRONTEND_PORT:-5174},http://127.0.0.1:${ETP_FRONTEND_PORT:-5174}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      ETP_DEMO_ENABLED: ${ETP_DEMO_ENABLED:-false}
      ETP_DEMO_COMPANY_DATA_ENABLED: ${ETP_DEMO_COMPANY_DATA_ENABLED:-false}
      ETP_DEMO_PASSWORD: ${ETP_DEMO_PASSWORD:-}
      ETP_DEMO_COLABORADOR_EMAIL: ${ETP_DEMO_COLABORADOR_EMAIL:-etp@gmail.com}
      ETP_DEMO_EMPRESA_EMAIL: ${ETP_DEMO_EMPRESA_EMAIL:-rhetp@gmail.com}
      ETP_DEMO_COMPANY_NAME: ${ETP_DEMO_COMPANY_NAME:-ETP Demonstração}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-etp_db}
      MYSQL_USER: ${DB_USER:-etp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em backend/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD em backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  mysql_data:
