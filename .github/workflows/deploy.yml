name: Deploy ETP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar, compilar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://etp.leofe.com.br/
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: etp_ci
          MYSQL_USER: etp_ci
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Testar scripts de implantação
        run: python3 tests/deploy-activation.py

      - name: Testar e compilar API
        env:
          ETP_DB_TEST: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: etp_ci
          DB_USER: etp_ci
          DB_PASSWORD: ci-test-only
          JWT_SECRET: Y2ktdGVzdC1vbmx5LXNlY3JldC1mb3ItZXRwLWludGVncmF0aW9uLXRlc3RzLTEyMzQ1Ng==
        run: mvn -B -ntp -f backend/pom.xml verify

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testar e compilar interface
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          test -s frontend/dist/index.html
          test -n "$(find frontend/dist/videos -type f -name '*.mp4' -print -quit)"
          test -s backend/target/etp-backend-0.1.0-SNAPSHOT.jar

      - name: Preparar SSH com chave e servidor conhecidos
        env:
          DEPLOY_KEY: ${{ secrets.ETP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ETP_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Enviar vídeos alterados e versão compilada
        env:
          DEPLOY_HOST: etpdeploy@147.15.127.35
        run: |
          git rev-parse HEAD:backend > backend/target/backend-source
          ssh -o BatchMode=yes "$DEPLOY_HOST" "mkdir -p /home/etpdeploy/incoming/${GITHUB_SHA}/frontend"
          rsync -a --checksum frontend/dist/videos/ "$DEPLOY_HOST:/opt/etp-systems/frontend/videos/"
          rsync -az --exclude='/videos/***' frontend/dist/ "$DEPLOY_HOST:/home/etpdeploy/incoming/${GITHUB_SHA}/frontend/"
          rsync -a backend/target/etp-backend-0.1.0-SNAPSHOT.jar \
            "$DEPLOY_HOST:/home/etpdeploy/incoming/${GITHUB_SHA}/etp-backend.jar"

          rsync -a backend/target/backend-source \
            "$DEPLOY_HOST:/home/etpdeploy/incoming/${GITHUB_SHA}/backend-source"

      - name: Ativar versão na VM
        env:
          DEPLOY_HOST: etpdeploy@147.15.127.35
        run: |
          ssh -o BatchMode=yes "$DEPLOY_HOST" "sudo -n /usr/local/sbin/etp-activate ${GITHUB_SHA}"
          curl --fail --silent --show-error --max-time 20 https://etp.leofe.com.br/
          curl --fail --silent --show-error --max-time 20 https://etp.leofe.com.br/api/cursos > /dev/null
