spring:
  application:
    name: etp-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:etp_db}
    username: ${DB_USER:etp_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}

etp:
  demo:
    enabled: ${ETP_DEMO_ENABLED:false}
    password: ${ETP_DEMO_PASSWORD:}
    colaborador-email: ${ETP_DEMO_COLABORADOR_EMAIL:etp@gmail.com}
    empresa-email: ${ETP_DEMO_EMPRESA_EMAIL:rhetp@gmail.com}
    company-name: ${ETP_DEMO_COMPANY_NAME:ETP Demonstração}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: etp-systems
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
