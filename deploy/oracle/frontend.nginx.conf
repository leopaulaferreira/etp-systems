server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # HTML e arquivos sem hash precisam ser revalidados após uma publicação.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O Vite gera nomes com hash: uma alteração cria uma nova URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /videos/ {
        gzip off;
        try_files $uri =404;
    }
}
